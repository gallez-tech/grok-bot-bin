name: Build Arch package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Prepare build user
        run: |
          pacman -Syu --noconfirm git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          chown -R builder:builder .
          sudo -u builder makepkg -sf --noconfirm

      - name: Add version-free alias
        run: |
          shopt -s nullglob
          pkgs=(grok-bot-bin-*.pkg.tar.zst)
          if (( ${#pkgs[@]} != 1 )); then
            echo "::error::Expected exactly one built package, got: ${pkgs[*]}"
            exit 1
          fi
          cp "${pkgs[0]}" grok-bot-bin-x86_64.pkg.tar.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-bot-bin
          path: '*.pkg.tar.zst'
          if-no-files-found: error

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.pkg.tar.zst'
          generate_release_notes: true
